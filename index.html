<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANG WEB TODO</title>
    <link type="text/css" href="styles/main.css" rel="stylesheet"/>
    <script src="src/loginStore.js"></script>
</head>
<body>
    <h1>DANG NHAP</h1>
    <form method="post" action="xulydangnhap.php" class="tencua-botrangdiem">
        <label>Email</label>
        <input type="email" id="email-input" />
        <br />

        <label>Mật khẩu</label>
        <input type="password" id="password-input" />
        <br />

        <button type="submit" id="login-button" class="form-dep" data-testid="login-submit">Đăng nhập</button>
    </form>
    <script>
        // tim ptu co id form-login
        const loginForm = document.getElementById("form-login");
        // dangki su kien "submit"
        loginForm.addEventListener("submit", function(event){
            event.preventDefault();// chan form du lieu di
            // thu thap thong tin tren o du lieu 
            var email = document.getElementById("email-input").value;
            var password = document.getElementById("password-input").value;
            // goi ham xu li 
            var thongbao = login(email,password);
            alert(thongbao);

        });
    </script>
</body>
</html>
