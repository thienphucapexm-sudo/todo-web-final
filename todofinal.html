            <button type="submit" id="add-todo-button">Thêm công việc</button>
        </form>
        <div id="todo-msg"></div>
    </section>

    
    <section class="section-danh-sach-cong-viec">

        const API_URL = 'http://localhost:3000/todos';

        async function renderTodos() {
            const html = await loadTodos(API_URL);
            document.getElementById('todo-list').innerHTML = html;
        }

        await renderTodos();

        const todoForm = document.getElementById('todo-form');
        todoForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const titleTuNguoiDung = document.getElementById('todo-title-input').value.trim();
            if (!titleTuNguoiDung) {
                document.getElementById('todo-msg').innerHTML = '<b>Vui lòng nhập tên công việc.</b>';
                return;
            }

            const savedTodo = await addTodo(API_URL, titleTuNguoiDung);
            document.getElementById('todo-msg').innerHTML = `Đã thêm công việc ${savedTodo.id} thành công!`;
            todoForm.reset();
            await renderTodos();
        });

        // >>>>>DELETE CLICK 
        // dang ki su kien click cho cac phan tu co class btn-delete
        // id thi chi co 1 phan tu , con class thi chua duoc nhieu id 

        const lstDeleteButtons = document.querySelectorAll('.btn-delete'); // tra ve dang list dung ham nay 
        // class btn-delete nam trong html va file store 
        // duyet qua tung id trong class 
        lstDeleteButtons.forEach((btn)=>{
            // lang nghe 
            btn.addEventListener("click", async (event)=>{
                // thu alert truoc 
                

                const id = btn.dataset.id; // cach lay id cua danh sach 
                //alert('da click nut xoa '+ id);


                const ok = confirm(`ban co muon xoa ${id} khong`);
                if(!ok){
                    return; 
                } // neu khong ok thi thoi , neu da ok thi chay tiep
                const deletedJob = await deleteTodo(API_URL,id);
                
                document.getElementById('todo-msg').innerHTML = `<b>Đã xóa ${deletedJob.id} thành công!</b>`;

            });

        });// btn la ten bien tu dat ten
        
        
        // >>>>EDIT CLICK 
        // tim tren trang cai html co class btn-edit
        const lstEditButtons = document.querySelectorAll(".btn-edit");
        lstEditButtons.forEach((btn) =>{
            const id = btn.dataset.id;
            const title = btn.dataset.title;

            // co the lang nghe su kien double click cung duoc
            btn.addEventListener("click" ,async (event)=>{
                // hien ra 1 cai nhap lieu 
                const newTitle = prompt("sua ten cong viec", title); // luu vao bien newtitle
                // goi ham sua 
                const updatedJob = await updateTodo(API_URL,id,newTitle);

                document.getElementById('todo-msg').innerHTML = `<b>Đã sua ${updatedJob.id} thành công!</b>`;

            });
        });

        // DANG KI SU KIEN CHECKBOX
        const lstCheckboxes = document.querySelectorAll(".todo-checkbox");
        lstCheckboxes.forEach((chk)=>{

                const updatedJob= await updateTodoStatus(API_URL,id,isCompleted);
